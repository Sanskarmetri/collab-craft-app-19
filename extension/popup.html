<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyBySelf Focus Lock</title>
  <style>
    body {
      width: 320px;
      padding: 16px;
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #1e3a8a 0%, #334155 100%);
      color: white;
      margin: 0;
    }
    h1 {
      font-size: 18px;
      margin: 0 0 12px 0;
    }
    .status {
      padding: 12px;
      background: rgba(255,255,255,0.1);
      border-radius: 8px;
      margin-bottom: 12px;
    }
    .status.active {
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid rgba(16, 185, 129, 0.5);
    }
    button {
      width: 100%;
      padding: 10px;
      background: rgba(255,255,255,0.2);
      border: none;
      border-radius: 6px;
      color: white;
      font-size: 14px;
      cursor: pointer;
      margin-top: 8px;
    }
    button:hover {
      background: rgba(255,255,255,0.3);
    }
    .blocked-list {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid rgba(255,255,255,0.2);
    }
    .blocked-list h2 {
      font-size: 14px;
      margin: 0 0 8px 0;
    }
    .blocked-list ul {
      list-style: none;
      padding: 0;
      margin: 0;
      font-size: 12px;
      opacity: 0.8;
    }
    .blocked-list li {
      padding: 4px 0;
    }
  </style>
</head>
<body>
  <h1>🔒 StudyBySelf Focus Lock</h1>
  <div id="status" class="status">
    <strong>Status:</strong> <span id="statusText">Loading...</span>
  </div>
  <button id="openApp">Open Study App</button>
  
  <div class="blocked-list">
    <h2>Blocked Sites During Focus</h2>
    <ul id="blockedSites"></ul>
  </div>

  <script src="popup.js"></script>
</body>
</html>
